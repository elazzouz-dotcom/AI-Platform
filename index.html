<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>طلبات المشاريع | تطبيق محلي</title>
<style>
:root{--p:#635bff;--t:#0f172a;--muted:#64748b;--line:#e2e8f0}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;color:var(--t);background:radial-gradient(circle at 10% 10%,#ffd6c9,transparent 28%),linear-gradient(135deg,#f5f3ff,#e7fffb);padding:25px 14px}.wrap{width:min(850px,100%);margin:auto}.top{color:#fff;padding:32px;border-radius:25px 25px 0 0;background:linear-gradient(120deg,#4938d5,#635bff 55%,#00a99d);box-shadow:0 16px 40px #4838d52b}.top p{margin:0 0 8px;color:#d9fffa;font-size:.85rem;font-weight:bold}.top h1{margin:0 0 10px;font-size:clamp(1.6rem,4vw,2.4rem)}.top span{color:#f0f4ff;line-height:1.8}.card{background:#ffffffee;padding:clamp(22px,5vw,48px);border-radius:0 0 25px 25px;box-shadow:0 20px 55px #3440542b}.row{display:flex;gap:16px;margin-bottom:18px}.col{flex:1}label{display:block;margin-bottom:8px;font-weight:bold;font-size:.9rem}input,select,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:#fff;font:inherit;outline:0;transition:.2s}textarea{min-height:135px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 4px #635bff1c}.hp{position:absolute;left:-9999px}.actions{display:flex;align-items:center;gap:15px;margin-top:22px}.send{border:0;border-radius:13px;padding:14px 24px;color:#fff;background:linear-gradient(100deg,#635bff,#8b5cf6);font:inherit;font-weight:bold;cursor:pointer}.send:disabled{opacity:.6;cursor:wait}.hint{font-size:.82rem;color:var(--muted)}#msg{min-height:25px;margin-top:16px;font-weight:bold}.ok{color:#087f5b}.err{color:#c62828}.panel{margin-top:24px;background:#fff;padding:22px;border-radius:20px;box-shadow:0 10px 30px #3440541b}.panel h2{margin-top:0;font-size:1.1rem}.lead{border-top:1px solid var(--line);padding:14px 0;line-height:1.8}.lead:first-of-type{border-top:0}.badge{display:inline-block;padding:3px 8px;border-radius:99px;color:#164e63;background:#cffafe;font-size:.75rem}@media(max-width:620px){.row{display:block;margin-bottom:0}.col{margin-bottom:18px}.actions{align-items:stretch;flex-direction:column}.send{width:100%}}
</style></head>
<body><main class="wrap"><header class="top"><p>تطبيق محلي — بدون خدمة خارجية</p><h1>خلّينا نسمعو لفكرتك</h1><span>أرسل طلب المشروع، وسيُحفظ مباشرة على هذا الجهاز داخل ملف البيانات المحلي.</span></header><section class="card"><form id="form" novalidate><div class="hp"><label>موقعك</label><input id="website" autocomplete="off"></div><div class="row"><div class="col"><label for="name">الاسم *</label><input id="name" required placeholder="مثال: أحمد العلوي" autocomplete="name"></div><div class="col"><label for="phone">الهاتف / واتساب</label><input id="phone" placeholder="06xxxxxxxx" autocomplete="tel"></div></div><div class="row"><div class="col"><label for="email">البريد الإلكتروني</label><input id="email" type="email" placeholder="name@example.com" autocomplete="email"></div><div class="col"><label for="type">نوع المشروع</label><select id="type"><option value="">اختار...</option><option>موقع تعريفي</option><option>موقع أعمال</option><option>متجر إلكتروني</option><option>تطبيق ويب</option><option>شي حاجة أخرى</option></select></div></div><label for="message">تفاصيل المشروع *</label><textarea id="message" required placeholder="شرح لينا شنو بغيتي..."></textarea><div class="actions"><button class="send">حفظ الطلب محلياً</button><span class="hint">* حقول إلزامية</span></div><div id="msg" role="status" aria-live="polite"></div></form></section><section class="panel"><h2>آخر الطلبات المحفوظة <button id="refresh" type="button">تحديث</button></h2><div id="list">جارٍ التحميل...</div></section></main>
<script>
const $=id=>document.getElementById(id),form=$('form'),msg=$('msg');
function notice(t,c){msg.textContent=t;msg.className=c||''}
async function load(){const r=await fetch('/api/leads');const d=await r.json();$('list').innerHTML=d.leads.length?d.leads.slice(0,10).map(x=>`<article class="lead"><b>${escapeHtml(x.name)}</b> <span class="badge">${escapeHtml(x.status)}</span><br><small>${escapeHtml(x.projectType||'مشروع غير محدد')} — ${new Date(x.createdAt).toLocaleString('ar-MA')}</small><br>${escapeHtml(x.message)}</article>`).join(''):'لا توجد طلبات بعد.'}
function escapeHtml(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;', '"':'&quot;'}[c]))}
form.addEventListener('submit',async e=>{e.preventDefault();const data={name:$('name').value.trim(),phone:$('phone').value.trim(),email:$('email').value.trim(),projectType:$('type').value,message:$('message').value.trim(),website:$('website').value.trim()};if(!data.name||!data.message)return notice('عمّر الاسم وتفاصيل المشروع.','err');const b=form.querySelector('button');b.disabled=true;b.textContent='جاري الحفظ...';try{const r=await fetch('/api/leads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error);notice('✅ تخزّن الطلب بنجاح على الجهاز.','ok');form.reset();load()}catch(x){notice('❌ '+x.message,'err')}finally{b.disabled=false;b.textContent='حفظ الطلب محلياً'}});$('refresh').onclick=load;load();
</script></body></html>
